<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364" role="img" aria-label="依頼から14分で画面が開き、42分で基本の7項目を終えた" font-family="'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="879" height="363" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
