<text x="32" y="293" font-size="11.5" fill="#6B7280">09:24:22 → 09:38:48</text>
<rect x="660.4" y="262" width="187.6" height="24" rx="4" fill="#0F766E"><title>ブラウザでのファイル操作: 14分26秒</title></rect>
<text x="670.4" y="279" font-size="13.5" font-weight="700" fill="#FFFFFF">14分26秒</text>
