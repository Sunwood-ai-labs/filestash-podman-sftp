<text x="559.9" y="324" font-size="12" text-anchor="middle" fill="#6B7280">20分</text>
<line x1="689.9" x2="689.9" y1="102" y2="306" stroke="#EEF0F2"/>
<text x="689.9" y="324" font-size="12" text-anchor="middle" fill="#6B7280">30分</text>
<line x1="819.8" x2="819.8" y1="102" y2="306" stroke="#EEF0F2"/>
<text x="819.8" y="324" font-size="12" text-anchor="middle" fill="#6B7280">40分</text>
<text x="32" y="126" font-size="14" fill="#111827">準備とイメージ取得</text>
<text x="32" y="143" font-size="11.5" fill="#6B7280">08:56:38 → 09:09:53</text>
<rect x="300.0" y="112" width="172.2" height="24" rx="4" fill="#0F766E"><title>準備とイメージ取得: 13分15秒</title></rect>
<text x="310.0" y="129" font-size="13.5" font-weight="700" fill="#FFFFFF">13分15秒</text>
<text x="32" y="176" font-size="14" fill="#111827">Podman machineの復旧と起動</text>
<text x="32" y="193" font-size="11.5" fill="#6B7280">09:09:53 → 09:11:14</text>
