<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 770" width="880" height="770" role="img" aria-label="25の操作のうち22を確認。確認できなかったのは3つ" font-family="'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="879" height="769" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#111827">25の操作のうち22を確認。確認できなかったのは3つ</text>
<text x="32" y="70" font-size="13.5" fill="#6B7280">Filestash v0.6.20261009 をSFTPサーバーにつなぎ、ブラウザで操作した結果。22のうち8は注記つき</text>
<circle cx="40" cy="104" r="8" fill="#0F766E"/>
<text x="56" y="109" font-size="12.5" fill="#111827">確認できた</text>
<circle cx="162" cy="104" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="162" cy="104" r="3" fill="#0F766E"/>
<text x="178" y="109" font-size="12.5" fill="#111827">確認できたが注記あり</text>
<circle cx="348" cy="104" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<path d="M345 101l6 6M351 101l-6 6" stroke="#111827" stroke-width="2"/>
<text x="364" y="109" font-size="12.5" fill="#111827">確認できなかった</text>
<text x="32" y="150" font-size="13" font-weight="700" fill="#6B7280">接続と表示</text>
<line x1="32" x2="424" y1="159" y2="159" stroke="#D1D5DB"/>
<circle cx="41" cy="184" r="8" fill="#0F766E"/>
<text x="60" y="183" font-size="14" fill="#111827">SFTP接続とログイン</text>
<text x="60" y="199" font-size="11.5" fill="#6B7280">ログイン後に共有フォルダーの一覧を表示</text>
<circle cx="41" cy="222" r="8" fill="#0F766E"/>
<text x="60" y="221" font-size="14" fill="#111827">日本語のファイル名・フォルダー名</text>
<text x="60" y="237" font-size="11.5" fill="#6B7280">欠けや文字化けなし</text>
<circle cx="41" cy="260" r="8" fill="#0F766E"/>
<text x="60" y="259" font-size="14" fill="#111827">グリッド／リスト表示の切替</text>
<text x="60" y="275" font-size="11.5" fill="#6B7280">両方向に切替</text>
<circle cx="41" cy="298" r="8" fill="#0F766E"/>
<text x="60" y="297" font-size="14" fill="#111827">名前順の並び替え</text>
<circle cx="41" cy="336" r="8" fill="#0F766E"/>
<text x="60" y="335" font-size="14" fill="#111827">日本語での名前検索</text>
<text x="60" y="351" font-size="11.5" fill="#6B7280">開いているフォルダー内の名前絞り込み</text>
<text x="32" y="388" font-size="13" font-weight="700" fill="#6B7280">プレビュー</text>
<line x1="32" x2="424" y1="397" y2="397" stroke="#D1D5DB"/>
<circle cx="41" cy="422" r="8" fill="#0F766E"/>
<text x="60" y="421" font-size="14" fill="#111827">テキストの表示</text>
<text x="60" y="437" font-size="11.5" fill="#6B7280">日本語の本文を表示</text>
<circle cx="41" cy="460" r="8" fill="#0F766E"/>
<text x="60" y="459" font-size="14" fill="#111827">画像（PNG）のプレビュー</text>
<circle cx="41" cy="498" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="41" cy="498" r="3" fill="#0F766E"/>
<text x="60" y="497" font-size="14" fill="#111827">Markdownの表示</text>
<text x="60" y="513" font-size="11.5" fill="#6B7280">色分けされたソース表示。整形表示ではない</text>
<circle cx="41" cy="536" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="41" cy="536" r="3" fill="#0F766E"/>
<text x="60" y="535" font-size="14" fill="#111827">音声（WAV）の再生</text>
<text x="60" y="551" font-size="11.5" fill="#6B7280">再生位置の進行まで。音は聞いていない</text>
<circle cx="41" cy="574" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="41" cy="574" r="3" fill="#0F766E"/>
<text x="60" y="573" font-size="14" fill="#111827">動画（MP4）の再生</text>
<text x="60" y="589" font-size="11.5" fill="#6B7280">再生位置の進行まで</text>
<circle cx="41" cy="612" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<path d="M38 609l6 6M44 609l-6 6" stroke="#111827" stroke-width="2"/>
<text x="60" y="611" font-size="14" fill="#111827">PDFの表示</text>
<text x="60" y="627" font-size="11.5" fill="#6B7280">本文の領域が空白のまま</text>
<text x="456" y="150" font-size="13" font-weight="700" fill="#6B7280">ファイル操作</text>
<line x1="456" x2="848" y1="159" y2="159" stroke="#D1D5DB"/>
<circle cx="465" cy="184" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="465" cy="184" r="3" fill="#0F766E"/>
<text x="484" y="183" font-size="14" fill="#111827">新規ファイルの作成と保存</text>
<text x="484" y="199" font-size="11.5" fill="#6B7280">保存中の表示が画面に残る。内容は保存済み</text>
<circle cx="465" cy="222" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="465" cy="222" r="3" fill="#0F766E"/>
<text x="484" y="221" font-size="14" fill="#111827">アップロード（1件）</text>
<text x="484" y="237" font-size="11.5" fill="#6B7280">完了後も速度表示が0.0B/sのまま</text>
<circle cx="465" cy="260" r="8" fill="#0F766E"/>
<text x="484" y="259" font-size="14" fill="#111827">ダウンロード（1件）</text>
<text x="484" y="275" font-size="11.5" fill="#6B7280">SHA-256が元ファイルと一致</text>
<circle cx="465" cy="298" r="8" fill="#0F766E"/>
<text x="484" y="297" font-size="14" fill="#111827">ファイル名の変更</text>
<text x="484" y="313" font-size="11.5" fill="#6B7280">日本語名へ変更</text>
<circle cx="465" cy="336" r="8" fill="#0F766E"/>
<text x="484" y="335" font-size="14" fill="#111827">ファイルの削除</text>
<text x="484" y="351" font-size="11.5" fill="#6B7280">サーバー側の一覧でも消えたことを確認</text>
<circle cx="465" cy="374" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="465" cy="374" r="3" fill="#0F766E"/>
<text x="484" y="373" font-size="14" fill="#111827">Markdownの編集と保存</text>
<text x="484" y="389" font-size="11.5" fill="#6B7280">元に戻すと改行コードの違いで1バイト差</text>
<circle cx="465" cy="412" r="8" fill="#0F766E"/>
<text x="484" y="411" font-size="14" fill="#111827">複数選択</text>
<text x="484" y="427" font-size="11.5" fill="#6B7280">操作欄はダウンロードと削除</text>
<circle cx="465" cy="450" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="465" cy="450" r="3" fill="#0F766E"/>
<text x="484" y="449" font-size="14" fill="#111827">ZIPでの一括ダウンロード</text>
<text x="484" y="465" font-size="11.5" fill="#6B7280">中身は一致。自動操作側の待機は30秒でタイムアウト</text>
<circle cx="465" cy="488" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<path d="M462 485l6 6M468 485l-6 6" stroke="#111827" stroke-width="2"/>
<text x="484" y="487" font-size="14" fill="#111827">複数ファイルのアップロード</text>
<text x="484" y="503" font-size="11.5" fill="#6B7280">ファイル選択が開かずタイムアウト</text>
<text x="456" y="540" font-size="13" font-weight="700" fill="#6B7280">フォルダーと権限</text>
<line x1="456" x2="848" y1="549" y2="549" stroke="#D1D5DB"/>
<circle cx="465" cy="574" r="8" fill="#0F766E"/>
<text x="484" y="573" font-size="14" fill="#111827">フォルダーの作成</text>
<circle cx="465" cy="612" r="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
<circle cx="465" cy="612" r="3" fill="#0F766E"/>
<text x="484" y="611" font-size="14" fill="#111827">フォルダー名の変更</text>
<text x="484" y="627" font-size="11.5" fill="#6B7280">2回目で確認。1回目は表示と通知が不一致</text>
<circle cx="465" cy="650" r="8" fill="#0F766E"/>
<text x="484" y="649" font-size="14" fill="#111827">フォルダーの削除</text>
<circle cx="465" cy="688" r="8" fill="#0F766E"/>
<text x="484" y="687" font-size="14" fill="#111827">読み取り専用フォルダーへの書込拒否</text>
<text x="484" y="703" font-size="11.5" fill="#6B7280">「アクセスが拒否されました」と表示</text>
<circle cx="465" cy="726" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
<path d="M462 723l6 6M468 723l-6 6" stroke="#111827" stroke-width="2"/>
<text x="484" y="725" font-size="14" fill="#111827">共有リンクの作成</text>
<text x="484" y="741" font-size="11.5" fill="#6B7280">設定の途中でダイアログが閉じ、作成に至らず</text>
</svg>